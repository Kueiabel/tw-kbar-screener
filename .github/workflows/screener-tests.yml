name: Screener regression checks
on:
  push:
    branches: ["主要的"]
    paths-ignore:
      - "reports/ci/**"
  workflow_dispatch:

concurrency:
  group: screener-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.0,<3.0" "numpy>=1.24,<3.0"
      - name: Compile and run actual tests, capture diagnostic log
        shell: bash
        run: |
          mkdir -p reports/ci
          set +e
          python -m compileall -q patterns.py twse_source.py app.py backtest_20261110.py tests > reports/ci/test_output.txt 2>&1
          compile_status=$?
          if [ "$compile_status" -eq 0 ]; then
            python -m unittest discover -s tests -v >> reports/ci/test_output.txt 2>&1
            test_status=$?
          else
            test_status=$compile_status
          fi
          cat reports/ci/test_output.txt
          echo "$test_status" > reports/ci/exit_code.txt
          exit 0
      - name: Save observable regression result to GitHub
        if: always()
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add reports/ci
          if ! git diff --cached --quiet; then
            git commit -m "Update test diagnostics [skip ci]"
            git push || echo "Cannot push diagnostics"
          fi
      - name: Fail workflow when actual tests fail
        run: test "$(cat reports/ci/exit_code.txt)" = "0"
