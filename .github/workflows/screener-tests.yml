name: Screener regression checks
on:
  push:
    branches:
      - "主要的"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.0,<3.0" "numpy>=1.24,<3.0"
      - name: Compile source
        run: python -m compileall -q patterns.py twse_source.py app.py tests
      - name: Run V-bottom tests
        run: python -m unittest discover -s tests -v
