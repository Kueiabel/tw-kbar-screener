name: Historical acceptance Nov 10 to Nov 13
on:
  workflow_dispatch:
  push:
    branches: ["主要的"]
    paths: ["scripts/run_acceptance_20261110.py"]

permissions:
  contents: write

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libraries
        run: python -m pip install -r requirements.txt
      - name: Fetch TWSE historical OHLCV and run Tuesday acceptance
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/run_acceptance_20261110.py
      - name: Upload complete acceptance output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-20261110
          path: reports/acceptance_20261110/*
          if-no-files-found: warn
      - name: Commit the actual report for review
        if: success()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add reports/acceptance_20261110/
          if ! git diff --cached --quiet; then
            git commit -m "Report official 2026-11-10 V/Sakata acceptance results [skip ci]"
            git push
          fi
