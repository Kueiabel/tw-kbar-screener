name: Historical acceptance Nov 10 to Nov 13
on:
  workflow_dispatch:
  push:
    branches: ["主要的"]
    paths:
      - "scripts/run_acceptance_20261110.py"
      - ".github/workflows/historical-acceptance.yml"

permissions:
  contents: write

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libraries
        run: python -m pip install -r requirements.txt
      - name: Fetch TWSE historical OHLCV, capture diagnostic result
        env:
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          mkdir -p reports/ci
          set +e
          python scripts/run_acceptance_20261110.py > reports/ci/historical_audit.log 2>&1
          result=$?
          cat reports/ci/historical_audit.log
          echo "$result" > reports/ci/historical_audit_exit.txt
          exit 0
      - name: Upload complete acceptance output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-20261110
          path: |
            reports/acceptance_20261110/*
            reports/ci/historical_audit*
          if-no-files-found: warn
      - name: Save actual audit and logs to GitHub
        if: always()
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add reports/ci/historical_audit* reports/acceptance_20261110/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Save TWSE audit result and diagnostics [skip ci]"
            git push || echo "Unable to push audit diagnostics"
          fi
      - name: Mark run failure if audit failed
        run: test "$(cat reports/ci/historical_audit_exit.txt)" = "0"
